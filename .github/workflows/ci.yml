name: CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-security:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run TruffleHog OSS (Credential Leaks)
        uses: trufflesecurity/trufflehog@v3.82.6
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  test-rust-sanitizer:
    name: Rust PII FFI Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/pii-sanitizer/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/pii-sanitizer/Cargo.lock') }}

      - name: Rust Code Formatting & Clippy Audit
        working-directory: services/pii-sanitizer
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Run Rust Unit & Boundary Tests
        working-directory: services/pii-sanitizer
        run: cargo test --verbose

  test-go-worker:
    name: Go Async PDF Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: workers/pdf-engine/go.sum

      - name: Run Go Linter & Race Detection
        working-directory: workers/pdf-engine
        run: |
          if [ -f go.mod ]; then
            go vet ./...
            go test -v -race -timeout 30s ./...
          else
            echo "Aguardando inicialização do modulo Go."
          fi

  test-fastapi-core:
    name: FastAPI Core & Agentic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting & Static Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest httpx

      - name: Linting with Ruff
        working-directory: services/core-api
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Checking
        working-directory: services/core-api
        run: |
          if [ -f pyproject.toml ] || [ -d tests ]; then
            mypy . --strict --ignore-missing-imports
          fi
