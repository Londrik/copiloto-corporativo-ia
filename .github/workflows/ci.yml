name: CI/CD Pipeline Corporativo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  test-rust-sanitizer:
    name: Rust PII Sanitizer Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check Rust Formatting & Linting
        working-directory: services/pii-sanitizer
        run: |
          cargo fmt --check
          cargo clippy --no-default-features -- -D warnings

      - name: Run Native Rust Unit Tests
        working-directory: services/pii-sanitizer
        run: cargo test --no-default-features --verbose

  test-fastapi-core:
    name: FastAPI Core & Agentic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: services/core-api
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest httpx
          pip install .

      - name: Linting and Formatting with Ruff
        working-directory: services/core-api
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Checking with Mypy
        working-directory: services/core-api
        run: mypy .

      - name: Run Async Pytest Suite
        working-directory: services/core-api
        run: pytest -v

  test-go-worker:
    name: Go Async PDF Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: workers/pdf-engine/go.sum

      - name: Run Go Linters, Tests & Race Detection
        working-directory: workers/pdf-engine
        run: |
          if [ -f go.mod ]; then
            go mod tidy
            go vet ./...
            go test -v -race -timeout 60s ./...
            go build -o /dev/null ./cmd/worker
          else
            echo "go.mod ainda nao presente nesta revisao."
          fi
