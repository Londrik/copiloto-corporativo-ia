[package]
name = "pii_sanitizer"
version = "0.1.0"
edition = "2021"

[lib]
name = "pii_sanitizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22.6", features = ["extension-module", "abi3-py310"], optional = true }
regex = "1.10.6"
once_cell = "1.19.0"

[features]
default = []
python = ["dep:pyo3"]
